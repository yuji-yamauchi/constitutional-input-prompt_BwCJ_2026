<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Constitutional Input Prompt</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="boards.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="mobile.css">
<script src="app.js" defer></script>
</head>
<body data-state="boot">
<a class="skip" href="#main" data-w="W-31"></a>
<div class="note band" id="demo-band" data-w="DEMO" hidden></div>

<!-- 入口（本人の字は入れない。字は app.js の表から） -->
<section class="gate-wrap" id="gate" hidden>
  <div class="gate">
    <div class="gate-head">
      <span class="gate-dot" aria-hidden="true"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="#FDEFC4"/><path d="M10 2.2v2M10 15.8v2M2.2 10h2M15.8 10h2M4.5 4.5l1.4 1.4M14.1 14.1l1.4 1.4M15.5 4.5l-1.4 1.4M5.9 14.1l-1.4 1.4"/></svg></span>
      <div>
        <div class="gate-name" data-w="W-01"></div>
        <div class="gate-tag" data-w="W-02"></div>
      </div>
    </div>
    <p class="gate-timeout" id="gate-timeout" data-w="W-03" hidden></p>
    <form id="gate-form" autocomplete="on">
      <label for="gate-pw" data-w="W-05"></label>
      <input id="gate-pw" name="password" type="password" autocomplete="current-password">
      <div class="gate-err" id="gate-err" role="alert" hidden></div>
      <button type="submit" class="btn btn-mint wide" id="gate-go" data-w="W-06"></button>
    </form>
    <p class="tiny" data-w="W-07"></p>
    <p class="tiny" data-w="W-08"></p>
  </div>
</section>

<section class="unconf" id="unconf" data-w="UNCONF" hidden></section>

<!-- 骨（入口を通るまで見せない） -->
<div class="shell" id="shell" hidden>

  <aside class="left" id="left">
    <div class="left-head">
      <button type="button" class="dot-btn" id="btn-reload" data-w-title="W-23" data-w-label="W-23"></button>
      <button type="button" class="sidebtn chat-back" id="btn-chatback" data-w-title="W-24" data-w-label="W-24">◨</button>
      <div class="left-name">
        <div class="left-name-main" data-w="W-01"></div>
        <div class="left-name-sub" data-w="W-02"></div>
      </div>
      <button type="button" class="sidebtn" id="btn-leftmin" data-w-title="W-26" data-w-label="W-26">◧</button>
    </div>
    <nav class="nav" id="nav">
      <button type="button" class="nav-btn" data-view="home"><span class="ico" aria-hidden="true"></span><span class="lbl" data-w="N-home"></span></button>
      <div class="nav-h" data-w="W-32a"></div>
      <button type="button" class="nav-btn" data-view="renshu"><span class="ico" aria-hidden="true"></span><span class="lbl" data-w="N-renshu"></span></button>
      <div class="nav-h" data-w="W-32b"></div>
      <button type="button" class="nav-btn" data-view="hikidashi"><span class="ico" aria-hidden="true"></span><span class="lbl" data-w="N-hikidashi"></span></button>
      <button type="button" class="nav-btn" data-view="kiroku"><span class="ico" aria-hidden="true"></span><span class="lbl" data-w="N-kiroku"></span></button>
      <div class="nav-h" data-w="W-32c"></div>
      <button type="button" class="nav-btn" data-view="seiri"><span class="ico" aria-hidden="true"></span><span class="lbl" data-w="N-seiri"></span></button>
      <button type="button" class="nav-btn" data-view="watasu"><span class="ico" aria-hidden="true"></span><span class="lbl" data-w="N-watasu"></span></button>
    </nav>
    <div class="left-foot">
      <span class="chip" data-w="W-27a"></span>
      <button type="button" class="linkbtn" id="btn-logout-left" data-w="W-28a"></button>
      <button type="button" class="linkbtn" id="btn-promise-left" data-w="PROMISE-LINK"></button>
      <div class="ver" data-w="W-29"></div>
    </div>
  </aside>

  <div class="center" id="center">
    <header class="hdr">
      <div class="crumb" id="crumb"></div>
      <button type="button" class="pill" id="btn-logout" data-w="W-28a"></button>
    </header>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <aside class="rail" id="rail">
    <div class="rail-grip" id="rail-grip" data-w-title="W-132"></div>
    <div class="rail-chatonly" id="rail-chatonly">
      <span data-w="W-131a"></span>
      <button type="button" class="linkbtn" id="btn-showmain" data-w="W-131b"></button>
      <button type="button" class="linkbtn" id="btn-railnote" data-w="W-131c" aria-expanded="false" aria-controls="rail-note"></button>
    </div>
    <div class="rail-head">
      <div class="rail-head-text">
        <div class="rail-note" id="rail-note">
          <div class="rail-title" data-w="W-120"></div>
          <div class="rail-desc" data-w="W-121"></div>
          <div class="rail-vis" id="rail-vis"></div>
        </div>
        <select id="rail-sel" class="rail-sel" data-w-label="W-122">
          <option value="mirai" data-w="W-123b"></option>
          <option value="renshu" data-w="W-123a"></option>
          <option value="kako" data-w="W-123c"></option>
        </select>
      </div>
      <button type="button" class="sidebtn" id="btn-railmin" data-w-title="W-124" data-w-label="W-124">◨</button>
    </div>
    <div class="rail-body" id="rail-body"></div>
  </aside>

</div>

<div id="modal-root"></div>
</body>
</html>
